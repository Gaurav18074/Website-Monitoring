services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U monitor"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]

  scheduler:
    build: .
    env_file: .env
    command: python -m app.scheduler
    depends_on:
      db: {condition: service_healthy}

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web]

volumes:
  pgdata:
